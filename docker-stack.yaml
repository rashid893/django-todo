version: "3.9"

networks:
  backend:
    driver: overlay

volumes:
  db_data:

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydatabase
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydatabase"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  web:
    image: rashidbrohi/todo-app:latest     # <-- IMPORTANT: use the image you built
    command: >
      sh -c '
        until pg_isready -h db -p 5432 -U myuser -d mydatabase; do
          echo "Waiting for db..."; sleep 2;
        done &&
        python manage.py migrate &&
        python manage.py runserver 0.0.0.0:8000
      '
    environment:
      DB_NAME: mydatabase
      DB_USER: myuser
      DB_PASSWORD: mypassword
      DB_HOST: db
      DB_PORT: 5432
    ports:
      - "8000:8000"
    # bind-mounts are okay on single-node swarm; ensure the path exists
    # volumes:
    #   - .:/app
    networks:
      - backend
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
