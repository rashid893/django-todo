# Project identification
sonar.projectKey=django-todo
sonar.projectName=Django Todo App
sonar.projectVersion=1.0

# Source settings
sonar.sources=.
sonar.language=py
sonar.sourceEncoding=UTF-8
sonar.python.version=3

# Ignore auto-generated Django migrations
sonar.exclusions=**/migrations/**

