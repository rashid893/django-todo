apiVersion: apps/v1
kind: Deployment
metadata:
  name: django-blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: django
      version: blue
  template:
    metadata:
      labels:
        app: django
        version: blue
    spec:
      containers:
      - name: django
        image: us-central1-docker.pkg.dev/YOUR_PROJECT_ID/django-repo/django-todo:latest
        ports:
        - containerPort: 8000
